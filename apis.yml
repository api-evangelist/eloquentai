aid: eloquentai
name: Eloquent AI
description: 'Eloquent AI builds autonomous AI operators for financial services and
  other regulated industries, automating complex customer operations end-to-end without
  requiring engineering or custom APIs. Its agents observe standard operating procedures
  and team actions, then securely drive CRMs, browsers, and desktop applications to
  resolve inquiries, process refunds, and manage returns. Marquee products include
  Fixer (a 24/7 autonomous customer-service agent), Closer (an AI sales representative),
  Navigator (an onboarding and support co-pilot), and Custom Agent (tailored enterprise
  agents). The platform layers a self-healing engine and an evals framework for quality
  assurance and regulatory compliance, and deploys across email, chat, SMS, WhatsApp,
  and voice with integrations into Salesforce, Zendesk, HubSpot, and Stripe. Founded
  in 2025 and based in San Francisco, it serves banking, insurance, fintech, cash
  advance, debt recovery, and SaaS. This profile was surfaced as a portfolio-company
  lead and enriched by the API Evangelist pipeline; the developer documentation portal
  is currently password-protected, so no public API specification is available yet.'
